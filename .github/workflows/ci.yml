name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only get what they ask for below.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ShellCheck, systemd-analyze, bats
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same container and entry point as `tests/run.sh` on a laptop.
      - name: Run test suite
        run: tests/run.sh
